schema_version: "1.0.0"
mcr_id: "MCR:2026:004"
snapshot_date: "2026-07-11"

authority:
  current: "NOTION_CANONICAL"
  repository_state: "SHADOW_NON_AUTHORITATIVE"
  cutover_decision: "pending"
  conflict_rule: "Notion remains authoritative until every cutover precondition passes and the Methodology Warden explicitly approves cutover."

source:
  root_page: "https://app.notion.com/p/382f5b2d1a9081e9a972f0b33fad3142"
  pages:
    glossary: "root Canonical Glossary YAML"
    registries: "02 ID Namespace Registry / Gate Registry"
    gate_spec_red_green_deploy: "07 machine-checkable contracts"
    gate_vdd: "05 GATE:VDD executable contract"
    gate_admit: "14 GATE:ADMIT machine-checkable contract"
    gate_regression: "23 GATE:REGRESSION normative section"
    profiles: "24 System / Change Profiles"
    governance_lifecycle: "19"
    evidence: "21"
    release: "22"

canonical_pipeline:
  - "GATE:SPEC"
  - "GATE:RED"
  - "GATE:GREEN"
  - "GATE:VDD"
  - "GATE:DEPLOY"

non_pipeline_gates:
  upstream:
    - "GATE:ADMIT"
  auxiliary:
    - "GATE:REGRESSION"

intentionally_undefined_ids:
  - "GATE:TIA"

artifacts:
  glossary: "governance/glossary.yaml"
  namespace_registry: "governance/registries/namespaces.yaml"
  gate_registry: "governance/registries/gates.yaml"
  gates: "governance/gates/*.yaml"
  system_profiles: "governance/profiles/system.yaml"
  change_profiles: "governance/profiles/change.yaml"
  applicability: "governance/profiles/applicability.yaml"
  schemas: "governance/schemas/*.schema.json"
  generated_view: "generated/notion-canonical-view.md"

cutover_preconditions:
  target_repository_selected: true
  repository_layout_committed: true
  schema_validation_pass: true
  stable_id_and_reference_lint_pass: true
  notion_to_repo_semantic_hash_match: false
  five_gate_conformance_tests_pass: true
  notion_generation_is_idempotent: true
  rollback_dry_run_pass: false
  observation_window_defined: false
  explicit_human_cutover_approval: false

invariants:
  gate_order_frozen: true
  stable_ids_reusable: false
  ledger_append_only: true
  additional_pipeline_gates_allowed: false
