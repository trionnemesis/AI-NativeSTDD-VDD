name: Governance shadow validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "skills/**"
      - ".claude/skills/**"
      - "governance/**"
      - "generated/notion-canonical-view.md"
      - "scripts/governance.py"
      - "tests/test_governance.py"
      - "integrations/codex/**"
      - "scripts/codex_adapter.py"
      - "tests/test_codex_adapter.py"
      - "docs/25-codex-adapter.md"
      - "README.md"
      - "requirements-governance.txt"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "setup/**"
      - "tests/test_hooks.py"
      - "integrations/codex/**"
      - "scripts/codex_adapter.py"
      - "tests/test_codex_adapter.py"
      - "docs/25-codex-adapter.md"
      - "README.md"
      - ".github/workflows/governance-shadow.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "skills/**"
      - ".claude/skills/**"
      - "governance/**"
      - "generated/notion-canonical-view.md"
      - "scripts/governance.py"
      - "tests/test_governance.py"
      - "requirements-governance.txt"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "setup/**"
      - "tests/test_hooks.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-governance.txt
      - run: python -m pip install -r requirements-governance.txt
      - run: python scripts/governance.py validate
      - run: python scripts/governance.py render --check
      - run: python scripts/governance.py render-skills --check
      - run: python scripts/codex_adapter.py validate
      - run: python -m unittest discover -s tests -v
